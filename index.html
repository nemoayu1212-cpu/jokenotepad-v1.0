<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>無題 - メモ帳</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Meiryo', 'Yu Gothic', sans-serif;
      background-color: #ffffff;
      color: #000000;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* 上部のメニューバー（Windowsメモ帳風） */
    .menu-bar {
      background-color: #f0f0f0;
      border-bottom: 1px solid #dcdcdc;
      padding: 4px 8px;
      display: flex;
      gap: 16px;
      font-size: 13px;
      user-select: none;
    }

    .menu-item {
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 3px;
    }

    .menu-item:hover {
      background-color: #e5f3ff;
      outline: 1px solid #cce8ff;
    }

    /* テキスト入力エリア */
    #editor {
      flex: 1;
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      padding: 12px;
      font-size: 16px;
      line-height: 1.5;
      font-family: 'MS Gothic', 'Consolas', monospace;
    }

    /* 下部のステータスバー */
    .status-bar {
      background-color: #f0f0f0;
      border-top: 1px solid #dcdcdc;
      padding: 4px 12px;
      font-size: 12px;
      color: #555555;
      display: flex;
      justify-content: flex-end;
      gap: 24px;
      user-select: none;
    }

    /* Windows風エラーダイアログ（保存ボタンを押した時用） */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.25);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .dialog {
      background-color: #ffffff;
      border: 1px solid #888888;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      width: 380px;
      max-width: 90%;
      font-size: 14px;
    }

    .dialog-title {
      background-color: #ffffff;
      padding: 8px 12px;
      font-size: 12px;
      color: #333333;
      border-bottom: 1px solid #eeeeee;
      display: flex;
      justify-content: space-between;
    }

    .dialog-body {
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      line-height: 1.5;
    }

    .error-icon {
      width: 32px;
      height: 32px;
      background-color: #e81123;
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 18px;
      flex-shrink: 0;
    }

    .dialog-footer {
      background-color: #f0f0f0;
      padding: 10px 16px;
      text-align: right;
      border-top: 1px solid #dfdfdf;
    }

    .dialog-btn {
      padding: 5px 24px;
      font-size: 13px;
      background-color: #e1e1e1;
      border: 1px solid #adadad;
      cursor: pointer;
    }

    .dialog-btn:hover {
      background-color: #e5f1fb;
      border-color: #0078d7;
    }
  </style>
</head>
<body>

  <!-- メニューバー -->
  <div class="menu-bar">
    <div class="menu-item" onclick="showFakeError()">ファイル(F) - 保存</div>
    <div class="menu-item" onclick="clearText()">編集(E) - 全消し</div>
    <div class="menu-item" onclick="alert('書式なんてありませんw')">書式(O)</div>
    <div class="menu-item" onclick="alert('草しか生えない欠陥メモ帳 v1.0')">ヘルプ(H)</div>
  </div>

  <!-- メインの入力欄 -->
  <textarea id="editor" placeholder="ここに文字を入力してください...（普通に入力できるとは言ってない）" autofocus></textarea>

  <!-- ステータスバー -->
  <div class="status-bar">
    <span id="char-count">草の数: 0 文字</span>
    <span>100%</span>
    <span>Windows (CRLF)</span>
    <span>UTF-8</span>
  </div>

  <!-- 保存エラーのダイアログ -->
  <div class="modal-overlay" id="errorModal">
    <div class="dialog">
      <div class="dialog-title">
        <span>メモ帳 - エラー</span>
        <span style="cursor:pointer;" onclick="closeFakeError()">✕</span>
      </div>
      <div class="dialog-body">
        <div class="error-icon">✕</div>
        <div>このファイルは重要すぎるため保存できません（嘘）</div>
      </div>
      <div class="dialog-footer">
        <button class="dialog-btn" onclick="closeFakeError()">OK</button>
      </div>
    </div>
  </div>

  <script>
    const editor = document.getElementById('editor');
    const charCount = document.getElementById('char-count');
    const errorModal = document.getElementById('errorModal');

    // ランダムに出る文字のリスト
    const kusaList = ['草', 'w', 'www', 'ww', '草生える'];

    // バグらず確実に文字をすり替える処理
    editor.addEventListener('beforeinput', (e) => {
      // バックスペースやDelete（削除操作）は普通に消せるように許可する
      if (e.inputType && e.inputType.startsWith('delete')) {
        return;
      }

      // エンターキー（改行）は普通に改行できるようにする
      if (e.inputType === 'insertLineBreak') {
        return;
      }

      // それ以外の文字入力（日本語変換確定・英数字・貼り付け）はすべてキャンセルして「草」にすり替え！
      e.preventDefault();

      // ランダムに1つ選ぶ
      const randomKusa = kusaList[Math.floor(Math.random() * kusaList.length)];

      // カーソル位置に文字を差し込む
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      const text = editor.value;
      editor.value = text.substring(0, start) + randomKusa + text.substring(end);

      // カーソルを挿入した文字の後ろに移動
      const newPos = start + randomKusa.length;
      editor.setSelectionRange(newPos, newPos);

      updateCount();
    });

    // 文字数（草の数）を更新
    editor.addEventListener('input', updateCount);
    function updateCount() {
      charCount.textContent = `草の数: ${editor.value.length} 文字`;
    }

    // Ctrl + S を押した時も保存エラーを出す！
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
        e.preventDefault(); // ブラウザの本当の保存画面をブロック
        showFakeError();
      }
    });

    function showFakeError() {
      errorModal.style.display = 'flex';
    }

    function closeFakeError() {
      errorModal.style.display = 'none';
      editor.focus();
    }

    function clearText() {
      editor.value = '';
      updateCount();
      editor.focus();
    }
  </script>
</body>
</html>
